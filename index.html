<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Interview</title>
<style>
  :root {
    color-scheme: dark;
    --bg:      #0b0e14;
    --surface: #141922;
    --line:    #232b39;
    --text:    #e8eef7;
    --muted:   #8b97a8;
    --accent:  #4c8dff;
    --accent-2:#7aa7ff;
    --danger:  #ff7b72;
    --wash:    #17202e;
    --strong:  #ffffff;
    --radius:  14px;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0; color: var(--text);
    background: var(--bg);
    /* A single soft wash behind the header, so the page has a top without a border. */
    background-image: radial-gradient(120% 60% at 50% 0%, var(--wash) 0%, var(--bg) 60%);
    background-attachment: fixed;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 2;
    padding: 14px 0 0;
    background: linear-gradient(var(--bg) 70%, transparent);
    backdrop-filter: blur(8px);
  }

  /* The transcript grows while someone talks. It wraps and keeps the newest words in
     view rather than clipping the line, because the tail is the part being spoken. */
  #heard {
    margin: 0 0 10px;
    color: var(--muted); font-size: 14px; letter-spacing: .01em;
    min-height: 20px; max-height: 3.2em;
    overflow-y: auto; overscroll-behavior: contain;
    white-space: pre-wrap; word-break: break-word;
    scrollbar-width: none;
  }
  #heard::-webkit-scrollbar { display: none; }

  /* the only feedback between the question ending and the first token landing */
  #prog {
    height: 3px; border-radius: 3px; width: 0; opacity: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .3s linear, opacity .3s;
  }
  body.busy #prog {
    width: 92%; opacity: 1;
    transition: width 6s cubic-bezier(0,.7,.2,1), opacity .15s;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px; margin: 14px 0 0;
    box-shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .22);
    animation: rise .22s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .card h2 {
    margin: 0 0 12px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: 600; line-height: 1.4;
    color: var(--muted); letter-spacing: .01em;
  }

  /* render() emits one <ul> per bullet, so the <ul> is what repeats and the gap has to
     live there. On the <li> it would never show: every item is its list's last child. */
  .card ul { margin: 0 0 10px; padding-left: 18px; list-style: none; }
  .card li, .card p { font-size: 19px; line-height: 1.5; }
  .card li { margin: 0; position: relative; }
  .card p { margin: 0 0 10px; }
  .card li::before {
    content: ""; position: absolute; left: -16px; top: .62em;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .card ul:last-child, .card p:last-child { margin-bottom: 0; }
  .card b { color: var(--strong); font-weight: 600; }

  .err { color: var(--danger); font-size: 15px; }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    #prog, body.busy #prog { transition: opacity .15s; }
  }
</style>
</head>
<body>

<header>
  <p id="heard">tap anywhere to start</p>
  <div id="prog"></div>
</header>
<main id="out"></main>

<script>
const RESUME_URL = 'https://kazemisoroush.github.io/resume/resume.txt';
const MODEL = 'claude-opus-5';
// served by our own backend (server.mjs or the Lambda) => answers come from
// `claude -p` on the subscription, gated by a Cognito sign-in token instead of an API key
const OURS = location.hostname !== 'kazemisoroush.github.io';

// Silence that means "they stopped talking", not merely "they drew breath". This has
// to sit above a natural speaking pause: below it, one question flushes two or three
// times, and every flush aborts and erases the answer the last one was still drawing.
// ponytail: one fixed timing, make it adapt to the speaker only if real interviews need it
const GAP = 1400;

const $ = id => document.getElementById(id);
const out = $('out'), heard = $('heard');

// --- the one pure decision, checked under ?test ---

// A stream that closed in under a second never really opened, so it counts toward
// giving up; one that survived means the browser is healthy and the count resets.
const GIVE_UP_AFTER = 6;
const nextStillborn = (lasted, n) => lasted < 1000 ? n + 1 : 0;

// What to say when we stop trying. 'network' is the one worth spelling out: Chrome's
// recogniser is not on-device, it streams audio to Google, and Brave disables that on
// purpose, so a browser that is online in every other respect still reports 'network'
// forever. Naming the browser saves debugging a network that is not broken.
const why = error => ({
  network: 'this browser has no speech service. Brave disables it on purpose, and some Chromium builds ship without the key. Open this page in Chrome or Safari.',
  'not-allowed': 'mic blocked — allow the microphone and reload',
  'service-not-allowed': 'mic blocked — allow the microphone and reload',
  'audio-capture': 'no microphone found — check the input device and reload',
}[error] ?? `the browser keeps closing the microphone: ${error || 'no error reported'}`);

// redirect_uri has to match the callback registered on the pool client character for
// character, so it is built from the page's own address rather than written out again.
const loginUrl = (cfg, here) =>
  `${cfg.domain}/login?client_id=${cfg.clientId}`
  + '&response_type=token&scope=openid'
  + `&redirect_uri=${encodeURIComponent(here)}`;

// The model replies SKIP when the utterance was not a question. While the first
// letters are still streaming, "S" could still become either SKIP or a real answer.
const verdict = t => {
  const s = t.trim().toLowerCase();
  if (s.length < 4) return 'skip'.startsWith(s) ? 'wait' : 'show';
  return /^skip\b/.test(s) ? 'skip' : 'show';
};

if (location.search.includes('test')) {
  const eq = (got, want, msg) => console.assert(got === want, msg, got);
  eq(verdict(''), 'wait', 'empty is undecided');
  eq(verdict('S'), 'wait', 'could still become SKIP');
  eq(verdict('Ski'), 'wait', 'still could');
  eq(verdict('SKIP'), 'skip', 'the skip sentinel');
  eq(verdict('skip'), 'skip', 'lowercase too');
  eq(verdict('Sydney based, 6 years'), 'show', 'a real answer starting with S');
  eq(verdict('Skipping the migration was not an option'), 'show', 'SKIP must be the whole word');
  eq(nextStillborn(120, 0), 1, 'a stream that died instantly counts');
  eq(nextStillborn(120, 3), 4, 'and keeps counting');
  eq(nextStillborn(45000, 5), 0, 'a healthy session resets the count');
  console.assert(why('network').includes('Chrome'), 'network names the browser to switch to');
  console.assert(why('weird-new-error').includes('weird-new-error'), 'an unknown error still reports itself');
  eq(verdict('- I ran the migration'), 'show', 'a bullet');
  const u = new URL(loginUrl({ domain: 'https://d.auth.us-east-1.amazoncognito.com', clientId: 'cid' },
                             'https://app.lambda-url.us-east-1.on.aws/'));
  eq(u.origin + u.pathname, 'https://d.auth.us-east-1.amazoncognito.com/login', 'the hosted page');
  eq(u.searchParams.get('response_type'), 'token', 'implicit grant returns the token directly');
  eq(u.searchParams.get('client_id'), 'cid', 'the pool client');
  eq(u.searchParams.get('redirect_uri'), 'https://app.lambda-url.us-east-1.on.aws/',
     'redirect_uri must match the registered callback exactly, encoding included');
  console.log('tests done');
}

// --- config, no button: Cognito hands the token back on the fragment the same way the
// GitHub Pages build takes an API key ---
const hash = new URLSearchParams(location.hash.slice(1));
for (const k of ['id_token', 'key']) if (hash.get(k)) localStorage[k + '_'] = hash.get(k).trim();
// Everything the fragment carried has been read by now, including a refusal, so clear it:
// a stale error left in the address bar outlives the problem it describes.
if (location.hash) history.replaceState(null, '', location.pathname);

const key = () => localStorage.key_ || '';
const token = () => localStorage.id_token_ || '';

// Injected by the Lambda into the page it serves. Absent when server.mjs serves it, which is
// what keeps the local flow sign-in free.
const SIGN_IN = window.SIGN_IN;

const login = () => {
  localStorage.removeItem('id_token_');
  location.href = loginUrl(SIGN_IN, location.origin + location.pathname);
};

// Cognito reports a refused sign-in on the fragment as well, and bouncing someone
// straight back to the hosted page reads as a loop rather than as a refusal.
const signInError = hash.get('error_description') || hash.get('error');

// Signed out is the state on a device that has never been here, so go straight to the
// hosted page rather than waiting for the first question to be rejected and lost.
if (SIGN_IN && signInError) {
  heard.innerHTML = '<span class="err"></span>';
  // textContent, not innerHTML: this text arrives on the fragment, so anyone can author it.
  heard.firstChild.textContent = signInError;
} else if (SIGN_IN && !token()) login();

// A rejected token rejects every utterance, so stop listening rather than stack up
// one error card per sentence the interviewer says. Signing in again is the recovery.
const gate = () => {
  dead = true;
  rec?.stop();
  if (SIGN_IN) return login();
  // Only the GitHub Pages build reaches here: it talks to the API directly on a key, and
  // has no sign-in to send anyone to. The local server rejects nothing at all.
  heard.innerHTML = '<span class="err">key rejected — reopen this page with #key=… on the URL</span>';
};

// --- resume as the system prompt, fetched from the live resume ---
let system = null;
const systemPrompt = async () => system ??= [{
  type: 'text',
  cache_control: { type: 'ephemeral' },
  text: `You are Soroush Kazemi in a live job interview. Answer in his voice, first person.

You are given raw speech from the interviewer's microphone. Most of it is not a
question: small talk, their own war stories, thinking aloud, the tail of the last
answer. If the utterance is not a question or a prompt aimed at the candidate,
reply with exactly SKIP and nothing else.

Rules:
- Short scannable bullet hints, not paragraphs. Max 5 bullets, one line each.
- Concrete: name the tech, the scale, the outcome. No filler, no preamble, no "great question".
- If it is a behavioural question, shape the bullets as situation / what I did / result.
- Only claim what the résumé supports.

His résumé:
${await fetch(RESUME_URL).then(r => r.text())}`
}];

// --- ask claude ---
let inflight, live;   // live = the card whose answer is still streaming

async function ask(q) {
  inflight?.abort();
  live?.remove();            // a superseded half-answer is noise, not history
  live = null;
  const ctl = inflight = new AbortController();
  document.body.classList.add('busy');

  // The card is created on the first real token, never up front: an utterance the
  // model rules a non-question must leave no trace on screen.
  let card = null, body = null;
  const show = () => {
    if (card) return;
    card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h2></h2><div></div>';
    card.querySelector('h2').textContent = q;
    out.prepend(card);
    body = card.querySelector('div');
    live = card;
  };

  const send = fast => fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    signal: ctl.signal,
    headers: {
      'content-type': 'application/json',
      'x-api-key': key(),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      ...(fast && { 'anthropic-beta': 'fast-mode-2026-02-01' })
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1024,
      stream: true,
      output_config: { effort: 'low' },
      ...(fast && { speed: 'fast' }),
      system: system,
      messages: [{ role: 'user', content: q }]
    })
  });

  try {
    let res;
    if (OURS) {
      res = await fetch('/ask', {
        method: 'POST', signal: ctl.signal,
        headers: { Authorization: `Bearer ${token()}` },
        body: JSON.stringify({ q })
      });
      if (res.status === 401) return gate();
    } else {
      await systemPrompt();
      res = await send(true);
      if (!res.ok) res = await send(false);   // fast mode unavailable or rate limited
      if (res.status === 401 || res.status === 403) return gate();
    }
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);

    let text = '', buf = '';
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    for (;;) {
      const { value, done } = await reader.read();
      // Released here rather than in `finally`: between this break and `finally` there
      // is an await, and a question arriving in that gap would erase a finished answer.
      if (done) { if (live === card) live = null; break; }
      if (OURS) {
        text += value;                        // our backend streams plain text
      } else {
        buf += value;
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'content_block_delta' && ev.delta.type === 'text_delta')
            text += ev.delta.text;
        }
      }
      const v = verdict(text);
      if (v === 'wait') continue;
      // Silence alone is indistinguishable from a broken app, so say which it is.
      if (v === 'skip') { heard.textContent = 'not a question'; ctl.abort(); return; }
      show();
      body.innerHTML = render(text);
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
    show();
    body.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  } finally {
    if (live === card) live = null;
    if (ctl === inflight) document.body.classList.remove('busy');
  }
}

// bullets and bold are all the model emits
const esc = s => s.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;');
const render = t => t.split('\n').filter(l => l.trim()).map(l => {
  const b = esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  return /^\s*[-*]\s/.test(l) ? `<ul><li>${b.replace(/^\s*[-*]\s/, '')}</li></ul>` : `<p>${b}</p>`;
}).join('');

// --- listening ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, said = '', timer, wake, dead = false;

// One atomic utterance: everything heard since the interviewer last stopped for GAP.
const flush = () => {
  const t = said.trim();
  said = '';
  if (t.split(/\s+/).filter(Boolean).length < 3) return;   // "mm hmm", "right", "okay"
  ask(t);
};

// Browsers only open the microphone after a user gesture, so the page itself is
// the button. This is the one and only tap the app ever needs.
const arm = async () => {
  if (!SR) return heard.innerHTML = '<span class="err">no speech recognition in this browser — use Chrome or Safari</span>';
  // Both '?.' matter: without the second, a browser with no wakeLock evaluates
  // undefined.catch, and the TypeError kills arm() before the microphone ever opens.
  wake = await navigator.wakeLock?.request('screen')?.catch(() => null);

  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-AU';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      if (e.results[i].isFinal) said += (said ? ' ' : '') + t; else interim = t;
    }
    heard.textContent = (said + ' ' + interim).trim() || 'listening';
    heard.scrollTop = heard.scrollHeight;   // the newest words, not the first ones
    clearTimeout(timer);            // still talking, so the utterance has not ended
    timer = setTimeout(flush, GAP);
  };
  // The browser ends the stream on its own: Chrome after a stretch of silence,
  // Safari after every utterance, and either of them instantly when the speech
  // service errors. Restarting the moment it ends turns that into a loop that
  // re-opens the microphone several times a second, which is what makes the
  // recording light strobe. So restart, but back off once sessions start dying
  // young, and give up loudly rather than hammering the microphone forever.
  let startedAt = 0, stillborn = 0, lastError = '';

  const listen = () => {
    if (dead) return;
    startedAt = Date.now();
    try { rec.start(); } catch { /* already running */ }
  };

  const giveUp = why => {
    dead = true;
    heard.innerHTML = `<span class="err">${why}</span>`;
  };

  // Every error is worth showing. Swallowing them is why a strobing microphone
  // looked like a mystery rather than whatever it actually is.
  rec.onerror = e => {
    lastError = e.error;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') giveUp(why(e.error));
  };

  rec.onend = () => {
    if (dead) return;
    stillborn = nextStillborn(Date.now() - startedAt, stillborn);
    if (stillborn > GIVE_UP_AFTER)
      return giveUp(why(lastError));
    setTimeout(listen, stillborn * 300);   // 0ms while healthy, backing off when not
  };

  listen();
  heard.textContent = 'listening';
};

addEventListener('pointerdown', arm, { once: true });
</script>
</body>
</html>
